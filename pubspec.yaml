name: phi_long_do
publish_to: 'none'

version: 1.0.1+7

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localization:

  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  url_launcher: ^6.3.2
  go_router: ^16.2.1
  year_month_picker:
    git:
      url: git@github.com:PhiLongDo/year_month_picker.git
      ref: 1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/png/
    - assets/webp/

  fonts:
    - family: NotoColorEmoji
      fonts:
        - asset: assets/fonts/NotoColorEmoji-Regular.ttf